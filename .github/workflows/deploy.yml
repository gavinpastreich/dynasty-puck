name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (app only; raw data and tools stay out of the published site)
        run: |
          mkdir -p _site
          cp -r index.html manifest.json shinylive-sw.js assets data fa prospects _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub refuses a deployment while the previous one is still finishing (two pushes a minute apart, or a push
      # right after the nightly job). Wait and try once more instead of failing the run.
      - name: Previous deployment still finishing; wait before one more try
        if: steps.deployment.outcome == 'failure'
        run: sleep 120
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
