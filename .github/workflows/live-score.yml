name: Live scoreboard
# Scores the fantasy week in progress while NHL games are on (each team's locked Fantrax lineup x the NHL stats API
# and live game feeds) and publishes one small file, score.json, to the 'live-data' branch. The site reads it from
# there (config/league.json -> live.url). Nothing is committed to main and the site is not redeployed.
#
# GitHub's scheduler starts this repository's timed jobs hours apart (an "hourly" job really runs every 3-7 hours),
# so one run covers a whole game night instead of counting on the next one: it waits for the next puck drop (up to
# live.waitHours), re-scores every few minutes while games are on, and stops when the night is over. A run that
# reaches GitHub's time limit starts its successor. The nightly refresh and the alerts job also give it a nudge.
# Runs on GitHub's servers (free for a public repository); uses no Claude usage.
# To pause it in the offseason: Actions tab -> Live scoreboard -> ... -> Disable workflow.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: live-score
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Last published file
        run: |
          if git fetch -q --depth=1 origin live-data 2>/dev/null && git show FETCH_HEAD:score.json > score.json 2>/dev/null; then
            echo "Found the last published score.json"
          else
            rm -f score.json
          fi
      - name: Follow tonight's games
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scoreboard.py --session --out score.json --publish "bash tools/live_publish.sh score.json"
