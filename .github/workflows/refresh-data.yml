name: Nightly data refresh
# Rebuilds data/*.js from the Fantrax league API (rosters, contracts, picks, standings), the NHL APIs and
# Daily Faceoff depth/injuries every night during the season, collects prospect headlines and re-scores every prospect,
# commits the result, and redeploys the site. (Pushes made with GITHUB_TOKEN don't trigger other
# workflows, so this job deploys Pages itself.)
on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC daily = early morning in North America
    - cron: "17 5 * * *"    # 1:17 AM ET: last night's games into the live scoreboard
  workflow_dispatch:
  push:                     # rebuild right away when the commissioner edits settings or uploads new raw files
    branches: [main]
    paths: ["config/**", "raw/**"]
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install openpyxl
      - name: Sync Fantrax, refresh research (injuries, depth charts) and rebuild data
        run: |
          python tools/research/scrape_dfo.py || echo "depth/injury scrape failed; keeping previous"
          python tools/build_data.py --refresh
      - name: Prospect Radar (headlines from NHL.com and public feeds, then tonight's re-score of every prospect)
        run: |
          python tools/research/scrape_news.py || echo "prospect news scrape failed; keeping the previous headlines"
          node tools/prospect_radar.js || echo "prospect radar build failed; keeping the previous file"
      - name: Commit if data changed
        id: commit
        run: |
          git config user.name "dynasty-puck-bot"
          git config user.email "dynasty-puck-bot@users.noreply.github.com"
          git add data raw/2026-27/fantrax raw/2026-27/weekly raw/2026-27/prospects tools/research/injuries.json tools/research/depth.json tools/build_report.txt
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else
            git commit -m "Nightly data refresh $(date -u +%Y-%m-%d)"
            # if someone pushed to main while this job was building: put this build on top of their commit; if the
            # two touch the same generated files, leave it unpublished rather than fail (the next run redoes it)
            if git push || (git pull --rebase origin main && git push); then echo "changed=true" >> "$GITHUB_OUTPUT"; else
              git rebase --abort 2>/dev/null || true
              echo "main moved while this job was building and the two changes overlap; this build is not published"
              echo "changed=false" >> "$GITHUB_OUTPUT"; fi; fi
      - name: Assemble site
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p _site
          cp -r index.html manifest.json shinylive-sw.js assets data fa prospects _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub refuses a deployment while the previous one is still finishing: wait and try once more
      - name: Previous deployment still finishing; wait before one more try
        if: steps.commit.outputs.changed == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 120
      - id: deployment_retry
        if: steps.commit.outputs.changed == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Wake the live scoreboard (GitHub's scheduler is unreliable, so every job that does run gives it a nudge)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # no nudge when a live run is already up or queued: the extra run would only sit in the queue and then
          # show as "cancelled" in the Actions tab
          up=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/live-score.yml/runs?per_page=10" \
            | jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length' 2>/dev/null || echo 0)
          if [ "${up:-0}" -gt 0 ] 2>/dev/null; then echo "live scoreboard already running or queued ($up): no nudge needed"; exit 0; fi
          curl -sS -o /dev/null -w "live scoreboard dispatch: HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/live-score.yml/dispatches" -d '{"ref":"main"}' || true
      - name: Sanity checks (a failure here emails the repository owner; the site has already been updated)
        if: always()
        run: |
          rc=0
          node tools/test/check_scoreboard.js || rc=1
          node tools/test/check_trade.js || rc=1
          node tools/test/check_radar.js || rc=1
          python tools/test/check_fantrax.py || rc=1
          exit $rc
