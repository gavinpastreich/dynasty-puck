<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Dynasty Puck HQ: projections, category values, simulators, contracts and prospects for the 14-team Dynasty Puck Fantrax league.">
  <title>Dynasty Puck HQ</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="top">
    <button class="iconbtn menubtn" id="menubtn" aria-label="Menu">☰</button>
    <a class="brand" href="#/home"><span class="logo" aria-hidden="true">🏒</span><span><b>Dynasty Puck</b><span class="full"> HQ</span></span></a>
    <span class="spacer"></span>
    <div class="search">
      <span class="ico" aria-hidden="true">⌕</span>
      <input id="gsearch" type="search" placeholder="Find a player  ( / )" aria-label="Find a player" autocomplete="off">
      <div class="results" id="gresults" role="listbox"></div>
    </div>
    <button class="livebtn idle" id="livebtn" aria-label="Fantrax sync status"><span class="dot" aria-hidden="true"></span><span class="lt">Nightly</span></button>
    <button class="teambtn" id="teambtn">🧢 Pick your team</button>
    <button class="iconbtn" id="themebtn" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">◐</button>
  </header>
  <div class="wrap">
    <nav class="side" id="nav" aria-label="Sections"></nav>
    <main id="main" tabindex="-1">
      <noscript><p>Dynasty Puck HQ needs JavaScript.</p></noscript>
      <p class="muted">Loading Dynasty Puck HQ…</p>
    </main>
  </div>

  <div class="picker-bg" id="picker-bg" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <div class="picker">
      <h2 id="picker-title">Which team is yours?</h2>
      <p class="muted">Pick your team so the app can tailor needs, targets, matchups and cap tools. It's remembered on this device only. You can switch any time from the top bar.</p>
      <div class="teams" id="picker-teams"></div>
      <p style="margin-top:14px"><button class="btn ghost" id="picker-skip">Just browsing</button></p>
    </div>
  </div>

  <div class="modal-bg" id="modal-bg" role="dialog" aria-modal="true">
    <div class="modal">
      <button class="btn sm mclose" id="modal-close" aria-label="Close">✕</button>
      <div class="mbody" id="modal-body"></div>
    </div>
  </div>
  <div class="tip" id="tip" role="tooltip"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="data/league.js"></script>
  <script src="data/prospects.js"></script>
  <script src="data/research.js"></script>
  <script src="assets/js/util.js"></script>
  <script src="assets/js/engine.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/player.js"></script>
  <script src="assets/js/pages-overview.js"></script>
  <script src="assets/js/pages-players.js"></script>
  <script src="assets/js/pages-sims.js"></script>
  <script src="assets/js/pages-trade.js"></script>
  <script src="assets/js/pages-cap.js"></script>
  <script src="assets/js/pages-prospects.js"></script>
  <script src="assets/js/pages-info.js"></script>
  <script src="assets/js/pages-extras.js"></script>
  <script src="assets/js/pages-alerts.js"></script>
  <script src="assets/js/pages-live.js"></script>
  <script src="assets/js/live.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
